# Local Postgres for development: pnpm db:up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dahpango
      POSTGRES_PASSWORD: dahpango
      POSTGRES_DB: dahpango
      TZ: America/Bogota
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
